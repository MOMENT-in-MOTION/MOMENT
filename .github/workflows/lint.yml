name: Lint
 
on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
 
jobs:
  pylint:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint
 
      - name: Run pylint
        run: |
          src_files=$(git ls-files 'src/*.py' 'src/**/*.py')
          test_files=$(git ls-files 'tests/*.py' 'tests/**/*.py')

           if [ -z "$src_files" ] && [ -z "$test_files" ]; then
            echo "No Python files found, skipping pylint."
            exit 0
          fi

          exit_code=0

          if [ -n "$src_files" ]; then
            echo "Linting src/..."
            python -m pylint --source-roots=. src/ || exit_code=$?
          fi

          if [ -n "$test_files" ]; then
            echo "Linting tests/..."
            python -m pylint --source-roots=. tests/ || exit_code=$?
          fi

          exit $exit_code
